[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "guardedpy"
version = "0.1.0"
description = "A governed, test-driven coding agent harness"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "jinja2",
    "python-multipart",
    "pydantic>=2,<3",
    "keyring",
    "openai",
    "pytest",
    "uvicorn",
    "pyyaml",
]

[project.scripts]
guardedpy = "guardedpy.cli:main"
guardedpy-cli = "guardedpy.cli:main"
guardedpy-server = "guardedpy.cli:server_main"

[project.optional-dependencies]
dev = ["httpx", "build"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
guardedpy = ["templates/*.html", "static/*.css", "static/*.js"]
