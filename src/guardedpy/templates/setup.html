{% extends "base.html" %}
{% block content %}
<section class="card">
  <p class="eyebrow">LOCAL SETUP</p>
  <h1>Connect one project</h1>
  <p class="muted">GuardedPy stays on this machine and runs one governed task at a time.</p>
  {% if error %}<p class="notice notice-error" role="alert">{{ error }}</p>{% endif %}
  <form method="post" action="/setup" class="form-grid">
    <label>Project root <input name="project_root" type="text" value="{{ project_root }}" required></label>
    <label>Source directories <input name="source_dirs" value="{{ source_dirs }}" required></label>
    <label>Test directories <input name="test_dirs" value="{{ test_dirs }}" required></label>
    <label>Pytest command <input name="pytest_command" value="{{ pytest_command }}" required></label>
    <label>Model <input name="model" value="{{ model }}" required></label>
    <label>Timeout seconds <input name="timeout_seconds" value="{{ timeout_seconds }}" type="number" min="5" max="120" required></label>
    <label>DeepSeek API key <input name="api_key" type="password" autocomplete="new-password" {% if not configured %}required{% endif %}></label>
    <button type="submit">Save local setup</button>
  </form>
</section>
{% endblock %}
