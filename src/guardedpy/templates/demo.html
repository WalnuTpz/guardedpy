<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>GuardedPy · 只读演示</title>
    <link rel="stylesheet" href="{{ url_for('static', path='app.css') }}">
  </head>
  <body>
    <header class="demo-header">
      <span class="demo-brand" translate="no">GuardedPy</span>
      <span class="badge badge-warn">只读演示</span>
      <span class="muted">离线治理机制场景</span>
    </header>
    <main class="demo-shell">
      <section class="card" aria-labelledby="demo-title">
        <p class="eyebrow">固定机制证据</p>
        <h1 id="demo-title">确定性安全验证</h1>
        <p class="muted">每个场景都在独立临时项目中运行脚本化离线 LLM；这里不提供设置、任务或审批操作。</p>
      </section>
      <section class="card" aria-labelledby="scenario-title">
        <h2 id="scenario-title">固定场景</h2>
        <ul class="demo-scenario-list">
          <li><a class="demo-scenario-link" href="/demo/scenarios/dangerous_action_denied">危险动作被拒绝</a></li>
          <li><a class="demo-scenario-link" href="/demo/scenarios/failure_feedback_corrects">失败反馈促成修正</a></li>
          <li><a class="demo-scenario-link" href="/demo/scenarios/tdd_source_patch_denied">未观察失败前拒绝源码修改</a></li>
        </ul>
      </section>
    </main>
  </body>
</html>
