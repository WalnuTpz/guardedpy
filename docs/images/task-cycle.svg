<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="818" viewBox="0 0 1080 818" role="img" aria-labelledby="title description">
  <title id="title">一次任务如何执行</title>
  <desc id="description">模型提出工具调用，经过权限判断和必要的单次审批后在本机执行；执行或拒绝结果返回模型。模型结束回复时，程序根据待验证修改判断回合是否完成。</desc>
  <defs>
    <style>
    text { font-family: "Noto Sans CJK SC", "Microsoft YaHei", "PingFang SC", "Droid Sans Fallback", sans-serif; }
    .heading { font-size: 25px; font-weight: 700; fill: #172B4D; }
    .title { font-size: 23px; font-weight: 600; fill: #172B4D; }
    .body { font-size: 17px; fill: #52627A; }
    .label { font-size: 17px; font-weight: 500; fill: #52627A; }
    .number { font-size: 16px; font-weight: 700; fill: #3667B7; }
    .edge { fill: none; stroke: #7A8CA5; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9 Z" fill="#7A8CA5"/></marker>
    <marker id="blue-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9 Z" fill="#4E79BC"/></marker>
    <marker id="green-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9 Z" fill="#39856C"/></marker>
  </defs>
<rect x="1" y="1" width="1078" height="816" rx="22" fill="#F7F9FC" stroke="#E1E7EF" stroke-width="1.4"/>
<rect x="24" y="24" width="1032" height="504" rx="14" fill="#FFFFFF" stroke="#DCE4EE" stroke-width="1.4"/>
<rect x="24" y="548" width="1032" height="246" rx="14" fill="#FFFFFF" stroke="#DCE4EE" stroke-width="1.4"/>
<rect x="48" y="45" width="40" height="30" rx="8" fill="#EEF4FF" stroke="#EEF4FF" stroke-width="1.4"/>
<text x="68" y="66" text-anchor="middle" class="number">01</text>
<text x="104" y="68" text-anchor="start" class="heading">模型与工具循环</text>
<text x="1008" y="68" text-anchor="end" class="body">一个回合可以多次往返</text>
<rect x="48" y="569" width="40" height="30" rx="8" fill="#EEF4FF" stroke="#EEF4FF" stroke-width="1.4"/>
<text x="68" y="590" text-anchor="middle" class="number">02</text>
<text x="104" y="592" text-anchor="start" class="heading">回合结束判断</text>
<text x="1008" y="592" text-anchor="end" class="body">模型结束回复时</text>
<path d="M 182 144 V 180" class="edge" marker-end="url(#arrow)"/>
<path d="M 292 227 H 416" class="edge" marker-end="url(#arrow)"/>
<path d="M 636 227 H 760" class="edge" marker-end="url(#arrow)"/>
<path d="M 526 274 V 326" class="edge" marker-end="url(#arrow)"/>
<path d="M 636 370 H 870 V 274" class="edge" marker-end="url(#arrow)"/>
<path d="M 930 274 V 470 H 182 V 274" class="edge" marker-end="url(#blue-arrow)" style="stroke: #4E79BC"/>
<path d="M 460 274 V 304 H 356 V 470 M 526 414 V 470" class="edge" style="stroke: #4E79BC"/>
<rect x="72" y="108" width="220" height="36" rx="18" fill="#F0F3F8" stroke="#DCE4EE" stroke-width="1.4"/>
<text x="182" y="133" text-anchor="middle" class="label">用户任务</text>
<rect x="72" y="180" width="220" height="94" rx="14" fill="#EEF4FF" stroke="#B9CDED" stroke-width="1.4"/>
<text x="182.0" y="222.0" text-anchor="middle" class="title">模型推理</text>
<text x="182.0" y="251.0" text-anchor="middle" class="body">理解任务 · 决定下一步</text>
<rect x="416" y="180" width="220" height="94" rx="14" fill="#FFFFFF" stroke="#CAD6E6" stroke-width="1.4"/>
<text x="526.0" y="222.0" text-anchor="middle" class="title">权限判断</text>
<text x="526.0" y="251.0" text-anchor="middle" class="body">解析参数 · 检查模式</text>
<rect x="760" y="180" width="220" height="94" rx="14" fill="#FFFFFF" stroke="#CAD6E6" stroke-width="1.4"/>
<text x="870.0" y="222.0" text-anchor="middle" class="title">本地执行</text>
<text x="870.0" y="251.0" text-anchor="middle" class="body">文件操作 · pytest</text>
<rect x="416" y="326" width="220" height="88" rx="14" fill="#FFF7E9" stroke="#EAD0A4" stroke-width="1.4"/>
<text x="526.0" y="365.0" text-anchor="middle" class="title">等待本次审批</text>
<text x="526.0" y="394.0" text-anchor="middle" class="body">允许或拒绝当前调用</text>
<text x="354" y="211" text-anchor="middle" class="label">工具调用</text>
<text x="698" y="211" text-anchor="middle" class="label">允许</text>
<text x="538" y="306" text-anchor="start" class="label">需审批</text>
<text x="748" y="354" text-anchor="middle" class="label">本次允许</text>
<text x="344" y="367" text-anchor="end" class="label">规则拒绝</text>
<text x="540" y="450" text-anchor="start" class="label">本次拒绝</text>
<text x="945" y="322" text-anchor="start" class="label">执行</text>
<text x="945" y="346" text-anchor="start" class="label">结果</text>
<text x="540" y="505" text-anchor="middle" class="body">执行结果或拒绝结果加入上下文，供下一次模型请求使用</text>
<circle cx="356" cy="470" r="3.6" fill="#4E79BC"/>
<circle cx="526" cy="470" r="3.6" fill="#4E79BC"/>
<path d="M 324 691 H 410 V 652 H 724" class="edge" marker-end="url(#green-arrow)" style="stroke: #39856C"/>
<path d="M 410 691 V 744 H 724" class="edge" marker-end="url(#arrow)"/>
<circle cx="410" cy="691" r="3.2" fill="#7A8CA5"/>
<rect x="72" y="644" width="252" height="94" rx="14" fill="#FFFFFF" stroke="#CAD6E6" stroke-width="1.4"/>
<text x="198.0" y="686.0" text-anchor="middle" class="title">检查验证状态</text>
<text x="198.0" y="715.0" text-anchor="middle" class="body">本回合是否仍有待验证修改</text>
<rect x="724" y="620" width="256" height="64" rx="14" fill="#ECF7F2" stroke="#B3D8C9" stroke-width="1.4"/>
<text x="852.0" y="647.0" text-anchor="middle" class="title">回合完成</text>
<text x="852.0" y="676.0" text-anchor="middle" class="body">可以继续下一项任务</text>
<rect x="724" y="712" width="256" height="64" rx="14" fill="#FFF7E9" stroke="#EAD0A4" stroke-width="1.4"/>
<text x="852.0" y="739.0" text-anchor="middle" class="title">本轮未完成</text>
<text x="852.0" y="768.0" text-anchor="middle" class="body">保留当前文件，继续处理</text>
<text x="566" y="638" text-anchor="middle" class="label" style="fill: #2F755D">无待验证修改</text>
<text x="566" y="730" text-anchor="middle" class="label">仍有待验证修改</text>
</svg>
